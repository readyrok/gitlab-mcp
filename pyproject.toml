[project]
name = "gitlab-mcp"
version = "0.1.0"
description = "MCP server exposing GitLab as tools for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["mcp", "gitlab", "ai-agent", "anthropic", "model-context-protocol"]

# Runtime dependencies — kept deliberately small.
# Each one earns its place; nothing speculative.
dependencies = [
    "mcp>=1.2.0",            # the official Model Context Protocol SDK
    "httpx>=0.27",           # async HTTP client for GitLab calls
    "pydantic>=2.7",         # data validation + tool-input schemas
    "pydantic-settings>=2.3", # 12-factor env-based config
    "python-dotenv>=1.0",    # .env loading for local dev
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Dev-only: never installed in production.
# `uv sync --all-extras` to install both groups.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",   # httpx mocking for unit tests
    "ruff>=0.5",     # linter + formatter, replaces flake8/black/isort
]

# Convenience entry points — `gitlab-mcp` runs the server.
[project.scripts]
gitlab-mcp = "gitlab_mcp.server:main"
agent = "agent.cli:main"

# Build system: Hatch is the modern default for src-layout projects.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_mcp", "src/agent"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. One tool replaces black, isort, flake8, pyupgrade.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle basics
# I   = import sorting (isort)
# UP  = modern python idioms
# B   = bugbear (catches common mistakes)
# SIM = simplify suggestions
# RUF = ruff-specific niceties
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length — handled by formatter, no need to double-warn

# ---------------------------------------------------------------------------
# Pytest: discovery + asyncio + coverage defaults.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",                   # show short summary for skipped/failed
    "--cov=gitlab_mcp",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/gitlab_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]